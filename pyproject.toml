[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiss"
version = "2.0.0"
description = "AI Surveillance System - real-time intrusion detection with OpenCV and SMS alerts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kudzayi Chimbodza" }]
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.5", "numpy>=1.21", "Pillow>=9.1", "twilio>=7.0", "python-dotenv>=0.19"]
keywords = ["computer-vision", "opencv", "surveillance", "intrusion-detection", "motion-detection"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aiss = "aiss.cli:main"

[tool.setuptools]
packages = ["aiss"]

[tool.setuptools.package-data]
aiss = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
